$kind: http-request
url: "{{baseUrl}}/vehicle/:id"
method: GET
pathVariables:
  id: "{{vehicleID}}"
auth:
  type: jwt
  credentials:
    isSecretBase64Encoded: true
    secret: "{{jwtSecret}}"
    algorithm: HS256
    payload: "{}"
    addTokenTo: header
    headerPrefix: Bearer
    queryParamKey: token
    header: "{}"
scripts:
  - type: afterResponse
    code: |-
      const vinDecode = pm.require('npm:vin-decode@0.2.0');
      const qa_workshop_package = pm.require('@postvehicle-enterprise-team-f6d2edb8-e6c3-4e70-8d7d-e8c98955/qa_workshop_package');

      var jsonData = pm.response.json();
      pm.test("VIN is a string", function () {
          
          pm.expect(jsonData.vehicle.vin).to.be.a.string;
      });

      pm.test("VIN is a validly-formatted string", function () {


          console.log("Checking VIN: " + jsonData.vehicle.vin + " ...");


          pm.expect(qa_workshop_package.isValidVIN(jsonData.vehicle.vin)).to.be.true;

          console.log("Decoding vin...");

          console.log(vinDecode(jsonData.vehicle.vin).decode());


      });
    language: text/javascript
    packages:
      "@postvehicle-enterprise-team-f6d2edb8-e6c3-4e70-8d7d-e8c98955/qa_workshop_package":
        id: 019e6eea-3515-73f9-befe-e3281d2cddf4
      npm:vin-decode@0.2.0:
        id: npm:vin-decode@0.2.0
order: 2000
